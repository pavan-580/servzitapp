services:
  postgres:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-servzit}
      POSTGRES_USER: ${POSTGRES_USER:-servzit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-servzit_local_only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - servzit_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-servzit} -d ${POSTGRES_DB:-servzit}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - servzit_redis:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  servzit_postgres:
  servzit_redis:
